---
- name: Reload systemd for Redis
  ansible.builtin.systemd:
    daemon_reload: true

- name: Validate Redis server configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/timeout
      - "{{ redis_server_config_validation_timeout }}s"
      - /usr/bin/redis-server
      - "{{ redis_server_wrapper_config }}"
      - --daemonize
      - "no"
      - --supervised
      - "no"
      - --port
      - "0"
      - --unixsocket
      - "{{ redis_server_config_validation_socket }}"
      - --unixsocketperm
      - "700"
      - --save
      - ""
      - --appendonly
      - "no"
      - --dir
      - /tmp
      - --dbfilename
      - "{{ redis_server_config_validation_dbfilename }}"
      - --pidfile
      - "{{ redis_server_config_validation_pidfile }}"
      - --logfile
      - ""
  register: redis_server_config_validation
  changed_when: false
  failed_when: redis_server_config_validation.rc not in [0, 124]
  no_log: "{{ redis_server_config_no_log }}"

- name: Restart Redis server
  ansible.builtin.service:
    name: "{{ redis_server_service_name }}"
    state: restarted
    enabled: "{{ redis_server_service_enabled }}"

- name: Restart Redis Sentinel
  ansible.builtin.service:
    name: "{{ redis_sentinel_service_name }}"
    state: restarted
    enabled: "{{ redis_sentinel_service_enabled }}"
