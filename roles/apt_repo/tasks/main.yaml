---
- name: "Validate required variables | {{ apt_repo_config.name | default('UNKNOWN') }}"
  ansible.builtin.assert:
    that:
      - apt_repo_config is defined
      - apt_repo_config.name is defined
      - apt_repo_config.url is defined
    msg: "Keys 'name' and 'url' must be defined in 'apt_repo_config' dictionary."

- name: "Ensure keyrings directory exists | {{ apt_repo_config.name }}"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: "Validate signing key source for deb822 | {{ apt_repo_config.name }}"
  ansible.builtin.assert:
    that:
      - apt_repo_var_key_ids | length == 0 or apt_repo_var_key_url | length > 0
    msg: >-
      Deb822 repositories require a direct key_url. key_ids/keyserver imports
      are supported only by the legacy .list path on Ubuntu older than 22.04.
  when: ansible_facts['distribution_version'] is version('22.04', '>=')

- name: "Configure legacy APT repository | {{ apt_repo_config.name }}"
  ansible.builtin.include_tasks: legacy.yml
  when: ansible_facts['distribution_version'] is version('22.04', '<')

- name: "Configure repository (Modern deb822 format) | {{ apt_repo_config.name }}"
  ansible.builtin.deb822_repository:
    name: "{{ apt_repo_config.name }}"
    types: "{{ apt_repo_config.types | default(apt_repo_types) }}"
    uris: "{{ apt_repo_config.url }}"
    suites: "{{ apt_repo_var_suite }}"
    components: >-
      {{
        omit if apt_repo_var_is_flat | bool or apt_repo_var_components | length == 0
        else apt_repo_var_components
      }}
    architectures: "{{ apt_repo_config.arch | default(apt_repo_arch) }}"
    signed_by: >-
      {{
        apt_repo_var_key_url if apt_repo_var_key_url | length > 0
        else omit
      }}
    state: "{{ apt_repo_config.state | default(apt_repo_state) }}"
  when: ansible_facts['distribution_version'] is version('22.04', '>=')
  notify: Update apt cache
  tags:
    - skip_ansible_lint
- name: "Remove repository files if state is absent | {{ apt_repo_config.name }}"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ apt_repo_config.name }}{{ item }}"
    state: absent
  loop:
    - ".list"
    - ".sources"
  when: (apt_repo_config.state | default(apt_repo_state)) == 'absent'
  notify: Update apt cache
