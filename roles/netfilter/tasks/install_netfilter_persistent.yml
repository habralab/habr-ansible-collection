---
- name: "Gather installed package facts"
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - netfilter
    - apt

- name: "Require explicit permission to replace UFW"
  ansible.builtin.assert:
    that:
      - netfilter_replace_ufw | bool
    fail_msg: >-
      The ufw package is installed and conflicts with netfilter-persistent.
      Set netfilter_replace_ufw=true to let this role remove UFW and take over
      firewall persistence.
  when:
    - "'ufw' in ansible_facts.packages"
  tags:
    - netfilter
    - apt

- name: "Remove UFW before installing netfilter-persistent"
  ansible.builtin.apt:
    name: "ufw"
    state: absent
  when:
    - "'ufw' in ansible_facts.packages"
    - netfilter_replace_ufw | bool
  become: true
  tags:
    - netfilter
    - apt

- name: "Install base netfilter packages"
  ansible.builtin.apt:
    name:
      - "iptables"
      - "ipset"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  become: true
  tags:
    - netfilter
    - apt

- name: "Install netfilter-persistent package"
  ansible.builtin.apt:
    name: "netfilter-persistent"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  when: ansible_facts['distribution_release'] in netfilter_persistent_available_releases
  become: true
  tags:
    - netfilter
    - apt

- name: "Install ipset-persistent package"
  ansible.builtin.apt:
    name: "ipset-persistent"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  when:
    - netfilter_use_ipset | bool
    - ansible_facts['distribution_release'] in netfilter_ipset_persistent_available_releases
  become: true
  tags:
    - netfilter
    - apt

- name: "Install iptables-persistent package"
  ansible.builtin.apt:
    name: "iptables-persistent"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  when:
    - netfilter_use_iptables | bool
    - ansible_facts['distribution_release'] in netfilter_iptables_persistent_available_releases
  become: true
  tags:
    - netfilter
    - apt
