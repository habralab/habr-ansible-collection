---
- name: Test Qdrant default configuration no-op
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load Qdrant role defaults
      ansible.builtin.include_vars:
        file: ../defaults/main.yml

    - name: Exercise Qdrant configuration tasks with defaults
      ansible.builtin.include_role:
        name: qdrant
        tasks_from: config

    - name: Verify default configuration ownership is disabled
      ansible.builtin.assert:
        that:
          - not qdrant_config_manage
          - qdrant_config_overrides | length == 0
        quiet: true
