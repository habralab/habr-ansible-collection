---
- name: Validate Node.js environment input shape
  ansible.builtin.assert:
    that:
      - nodejs_environments is sequence
      - nodejs_environments is not string
      - nodejs_environments | length > 0
    fail_msg: "Variable 'nodejs_environments' must be a non-empty list."
    quiet: true
  tags:
    - nodejs

- name: Gather facts required by system Node.js providers
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - architecture
      - distribution
  when: >-
    nodejs_environments
    | selectattr('scope', 'defined')
    | selectattr('scope', 'equalto', 'system')
    | list
    | length > 0
  tags:
    - nodejs

- name: Validate each declarative Node.js environment
  ansible.builtin.include_tasks:
    file: validate_environment.yml
    apply:
      tags:
        - nodejs
  loop: "{{ nodejs_environments }}"
  loop_control:
    loop_var: current_nodejs_environment
    label: "{{ current_nodejs_environment.name | default('UNKNOWN') }}"
  tags:
    - nodejs

- name: Initialize normalized Node.js environment results
  ansible.builtin.set_fact:
    nodejs_environment_results: {}
  tags:
    - nodejs

- name: Validate environment topology
  ansible.builtin.assert:
    that:
      - >-
        nodejs_environments | map(attribute='name') | list | unique | length
        == nodejs_environments | length
      - >-
        nodejs_environments
        | selectattr('scope', 'equalto', 'system')
        | list
        | length <= 1
      - >-
        nodejs_environments
        | selectattr('scope', 'equalto', 'user')
        | map(attribute='user')
        | list
        | unique
        | length
        == nodejs_environments
           | selectattr('scope', 'equalto', 'user')
           | list
           | length
    fail_msg: >-
      Environment names and user targets must be unique, and at most one
      system-scoped Node.js environment may be declared.
    quiet: true
  tags:
    - nodejs

- name: Materialize each declarative Node.js environment
  ansible.builtin.include_tasks:
    file: environment.yml
    apply:
      tags:
        - nodejs
  loop: "{{ nodejs_environments }}"
  loop_control:
    loop_var: current_nodejs_environment
    label: "{{ current_nodejs_environment.name | default('UNKNOWN') }}"
  tags:
    - nodejs
