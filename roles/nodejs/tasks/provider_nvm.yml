---
- name: Lookup passwd entry for NVM environment user
  ansible.builtin.getent:
    database: passwd
    key: "{{ _nodejs_environment.user }}"
    fail_key: false
  register: _nodejs_nvm_target_user_getent

- name: Normalize NVM environment user availability
  ansible.builtin.set_fact:
    _nodejs_nvm_target_user_exists: >-
      {{
        _nodejs_nvm_target_user_getent.ansible_facts.getent_passwd is defined
        and _nodejs_nvm_target_user_getent.ansible_facts.getent_passwd.get(
          _nodejs_environment.user
        ) is not none
      }}

- name: Fail if NVM environment user is missing
  ansible.builtin.assert:
    that:
      - _nodejs_nvm_target_user_exists
    fail_msg: >-
      The user '{{ _nodejs_environment.user }}' does not exist. Create it before
      provisioning Node.js environment '{{ _nodejs_environment.name }}'.
    quiet: true
  when: not ansible_check_mode

- name: Report missing NVM environment user in check mode
  ansible.builtin.debug:
    msg: >-
      User '{{ _nodejs_environment.user }}' is missing. User-dependent work is
      skipped in check mode for '{{ _nodejs_environment.name }}'.
  when:
    - ansible_check_mode
    - not _nodejs_nvm_target_user_exists

- name: Normalize NVM environment context
  ansible.builtin.set_fact:
    _nodejs_nvm_user_fact: >-
      {{
        _nodejs_nvm_target_user_getent.ansible_facts.getent_passwd[
          _nodejs_environment.user
        ]
      }}
  when: _nodejs_nvm_target_user_exists

- name: Resolve NVM environment paths
  ansible.builtin.set_fact:
    _nodejs_nvm_user_home: "{{ _nodejs_nvm_user_fact[4] }}"
    _nodejs_nvm_dir: "{{ _nodejs_nvm_user_fact[4] ~ '/.nvm' }}"
    _nodejs_nvm_profile_path: >-
      {{
        _nodejs_nvm_user_fact[4]
        ~ '/'
        ~ (_nodejs_environment.provider.profile | default(nodejs_nvm_profile))
      }}
  when: _nodejs_nvm_target_user_exists

- name: Install NVM provider prerequisites
  ansible.builtin.apt:
    name: "{{ nodejs_nvm_packages }}"
    state: present
  become: true
  when: _nodejs_nvm_target_user_exists

- name: Clone NVM repository for environment user
  ansible.builtin.git:
    repo: "{{ _nodejs_environment.provider.repo | default(nodejs_nvm_repo) }}"
    dest: "{{ _nodejs_nvm_dir }}"
    version: >-
      {{ _nodejs_environment.provider.version | default(nodejs_nvm_version) }}
    depth: 1
    update: true
    accept_hostkey: true
    recursive: false
  become: true
  become_user: "{{ _nodejs_environment.user }}"
  diff: false
  when: _nodejs_nvm_target_user_exists

- name: Add NVM configuration to environment user profile
  ansible.builtin.blockinfile:
    path: "{{ _nodejs_nvm_profile_path }}"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: NVM"
    block: |
      export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
  become: true
  become_user: "{{ _nodejs_environment.user }}"
  when: _nodejs_nvm_target_user_exists

- name: Normalize unmanaged NVM environment result
  ansible.builtin.set_fact:
    nodejs_environment_result:
      name: "{{ _nodejs_environment.name }}"
      scope: "{{ _nodejs_environment.scope }}"
      state: "{{ _nodejs_environment.state }}"
      user: "{{ _nodejs_environment.user }}"
      execution_user: "{{ _nodejs_environment.user }}"
      provider:
        type: nvm
        version: >-
          {{ _nodejs_environment.provider.version | default(nodejs_nvm_version) }}
        nvm_dir: "{{ _nodejs_nvm_dir }}"
        profile_path: "{{ _nodejs_nvm_profile_path }}"
      runtime:
        state: unmanaged
  when: _nodejs_nvm_target_user_exists

- name: Materialize managed NVM runtime
  ansible.builtin.include_tasks: runtime_nvm.yml
  when:
    - _nodejs_nvm_target_user_exists
    - _nodejs_environment.runtime.state == 'present'
