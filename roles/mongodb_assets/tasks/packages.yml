---
- name: Install MongoDB Python client packages
  ansible.builtin.apt:
    name: "{{ mongodb_assets_python_packages }}"
    state: present
  when: mongodb_assets_python_packages | length > 0

- name: Inspect MongoDB Python client availability
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['python']['executable'] }}"
      - -c
      - "import pymongo; print(pymongo.version)"
  register: mongodb_assets_pymongo_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Explain unavailable MongoDB asset checks
  ansible.builtin.debug:
    msg: >-
      MongoDB assets cannot be inspected until PyMongo is installed. Apply the
      package stage once, then check mode can inspect application users.
  when:
    - ansible_check_mode
    - mongodb_assets_pymongo_probe.rc != 0

- name: Require MongoDB Python client after package installation
  ansible.builtin.assert:
    that:
      - mongodb_assets_pymongo_probe.rc == 0
    fail_msg: >-
      MongoDB asset management requires PyMongo in the target Ansible Python
      environment. Adjust mongodb_assets_python_packages for this host.
    quiet: true
  when: not ansible_check_mode

- name: Require supported MongoDB Python client version
  ansible.builtin.assert:
    that:
      - mongodb_assets_pymongo_probe.stdout is version(__mongodb_assets_min_pymongo_version, '>=')
    fail_msg: >-
      community.mongodb 1.8 requires PyMongo {{ __mongodb_assets_min_pymongo_version }}
      or newer; found {{ mongodb_assets_pymongo_probe.stdout }}.
    quiet: true
  when: mongodb_assets_pymongo_probe.rc == 0
