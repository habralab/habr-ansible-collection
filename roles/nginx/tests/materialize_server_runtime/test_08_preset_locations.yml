---
# Tests for location preset logic.
#
# Preset activation rules:
#   preset_explicit_config = preset exists in nginx_server_location_preset_defaults
#                            OR in item.location_presets
#   preset_enabled = effective_config.enabled | default(preset_explicit_config)
#
# So: defining a preset in nginx_server_location_presets alone does NOT enable it.
# It must appear in defaults OR in per-server location_presets.

- name: "PRESETS | preset defined globally but not in defaults or server → not applied"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    nginx_server_location_presets:
      health:
        name: "/health"
        return:
          code: 200
    nginx_server_location_preset_defaults: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        # no location_presets key → preset_explicit_config=False → not enabled
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Preset only in nginx_server_location_presets → not applied"
      ansible.builtin.assert:
        that:
          - _nginx_server_runtime.myapp.locations
              | selectattr('name', 'equalto', '/health') | list | length == 0
        success_msg: "PASS: preset only in nginx_server_location_presets → not applied"
        fail_msg: "FAIL: locations={{ _nginx_server_runtime.myapp.locations | map(attribute='name') | list }}"


- name: "PRESETS | preset in nginx_server_location_preset_defaults → auto-enabled"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    nginx_server_location_presets:
      health:
        name: "/health"
        return:
          code: 200
    nginx_server_location_preset_defaults:
      health: {}    # presence alone makes preset_explicit_config=True → enabled
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Preset in nginx_server_location_preset_defaults → auto-enabled"
      ansible.builtin.assert:
        that:
          - _nginx_server_runtime.myapp.locations
              | selectattr('name', 'equalto', '/health') | list | length == 1
        success_msg: "PASS: preset in nginx_server_location_preset_defaults → auto-enabled"
        fail_msg: "FAIL: locations={{ _nginx_server_runtime.myapp.locations | map(attribute='name') | list }}"


- name: "PRESETS | preset in server location_presets → enabled for that server"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    nginx_server_location_presets:
      health:
        name: "/health"
        return:
          code: 200
    nginx_server_location_preset_defaults: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        location_presets:
          health: {}    # presence makes preset_explicit_config=True → enabled
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Preset in server location_presets → enabled for that server"
      ansible.builtin.assert:
        that:
          - _nginx_server_runtime.myapp.locations
              | selectattr('name', 'equalto', '/health') | list | length == 1
        success_msg: "PASS: preset in server location_presets → enabled for that server"
        fail_msg: "FAIL: locations={{ _nginx_server_runtime.myapp.locations | map(attribute='name') | list }}"


- name: "PRESETS | explicit enabled:false in preset_defaults disables preset"
