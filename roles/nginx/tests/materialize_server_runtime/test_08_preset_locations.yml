  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    nginx_server_location_presets:
      health:
        name: "/health"
        return:
          code: 200
    nginx_server_location_preset_defaults:
      health:
        enabled: false
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Enabled:false in preset_defaults disables the preset"
      ansible.builtin.assert:
