        fail_msg: "FAIL: locations={{ _nginx_server_runtime.myapp.locations | map(attribute='name') | list }}"


- name: "PRESETS | server location_presets enabled:true overrides disabled global default"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    nginx_server_location_presets:
      health:
        name: "/health"
        return:
          code: 200
    nginx_server_location_preset_defaults:
      health:
        enabled: false
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        location_presets:
          health:
            enabled: true    # server overrides global disabled
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Server enabled:true overrides global enabled:false"
      ansible.builtin.assert:
        that:
          - _nginx_server_runtime.myapp.locations
              | selectattr('name', 'equalto', '/health') | list | length == 1
        success_msg: "PASS: server enabled:true overrides global enabled:false"
        fail_msg: "FAIL: locations={{ _nginx_server_runtime.myapp.locations | map(attribute='name') | list }}"


- name: "PRESETS | server location_presets merges into preset location definition"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    nginx_server_location_presets:
      health:
        location:
          name: "/health"
          return:
            code: 200
    nginx_server_location_preset_defaults: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        location_presets:
          health:
            location:
              return:
                code: 204    # override return code via combine
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_loc"
      ansible.builtin.set_fact:
        nginx_t_loc: >-
          {{ _nginx_server_runtime.myapp.locations
             | selectattr('name', 'equalto', '/health') | first }}
    - name: "Server location_presets.location merges into preset definition"
      ansible.builtin.assert:
        that:
          - nginx_t_loc is defined
          - nginx_t_loc.return.code == 204
        success_msg: "PASS: server location_presets.location merges into preset definition"
        fail_msg: "FAIL: location={{ nginx_t_loc | to_nice_json }}"


- name: "PRESETS | preset without .location wrapper uses definition directly as location"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    # Flat definition (no .location wrapper) — whole dict is the location
    nginx_server_location_presets:
      robots:
        name: "/robots.txt"
        return:
          code: 200
          body: "User-agent: *\nDisallow:"
    nginx_server_location_preset_defaults:
      robots: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_loc"
      ansible.builtin.set_fact:
        nginx_t_loc: >-
          {{ _nginx_server_runtime.myapp.locations
             | selectattr('name', 'equalto', '/robots.txt') | first }}
    - name: "Flat preset definition (no .location wrapper) used as location directly"
      ansible.builtin.assert:
        that:
          - nginx_t_loc is defined
          - nginx_t_loc.return.code == 200
        success_msg: "PASS: flat preset definition (no .location wrapper) used as location directly"
        fail_msg: "FAIL: location={{ nginx_t_loc | to_nice_json }}"


- name: "PRESETS | preset without name in location definition is silently skipped"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_maintenance: {}
    nginx_server_location_presets:
      broken:
        return:
          code: 200
          # no 'name' field → preset_materialized_location.name is not defined → skipped
    nginx_server_location_preset_defaults:
      broken: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Preset without location name is silently skipped"
      ansible.builtin.assert:
        that:
          - _nginx_server_runtime.myapp.locations | length == 0
        success_msg: "PASS: preset without location name is silently skipped"
        fail_msg: "FAIL: locations={{ _nginx_server_runtime.myapp.locations }}"
