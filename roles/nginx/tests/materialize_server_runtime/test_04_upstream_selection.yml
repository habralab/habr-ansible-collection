---
# Tests for upstream_selection → derived maps logic.
# Selections generate nginx map blocks that route traffic to different upstreams
# based on a source variable (cookie, header expression, etc.).

- name: "SELECTION | cookie source generates map from $cookie_name"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_location_presets: {}
    nginx_server_location_preset_defaults: {}
    nginx_server_maintenance: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        upstream_selection:
          - name: backend_override
            source:
              cookie: backend
            default_target: ""
            selectors: []
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_sel_map"
      ansible.builtin.set_fact:
        nginx_t_sel_map: >-
          {{ _nginx_server_runtime.myapp.maps_registry.derived
             | selectattr('name', 'equalto', 'backend_override') | first }}
    - name: "Cookie source"
      ansible.builtin.assert:
        that:
          - nginx_t_sel_map.source == '$cookie_backend'
          - nginx_t_sel_map.target == '$myapp_upstream_selection_backend_override'
        success_msg: "PASS: cookie source 'backend' maps from '$cookie_backend'"
        fail_msg: "FAIL: map={{ nginx_t_sel_map | to_nice_json }}"


