- name: "POOLS | member-level fail_timeout used when pool has none"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_location_presets: {}
    nginx_server_location_preset_defaults: {}
    nginx_server_maintenance: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        upstream_members:
          - name: web1
            address: "10.0.0.1:8080"
            max_fails: 3
            fail_timeout: "20s"
        upstream_pools:
          - name: web
            members: [web1]
            # no max_fails or fail_timeout → member values used as fallback
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_host"
      ansible.builtin.set_fact:
        nginx_t_host: >-
          {{ (_nginx_server_runtime.myapp.upstreams_registry.materialized
              | selectattr('name', 'equalto', 'myapp_web') | first).hosts[0] }}
    - name: "Member max_fails/fail_timeout used when pool has none"
      ansible.builtin.assert:
        that:
          - nginx_t_host.max_fails == 3
          - nginx_t_host.fail_timeout == '20s'
        success_msg: "PASS: member max_fails/fail_timeout used when pool has none"
        fail_msg: "FAIL: host={{ nginx_t_host | to_nice_json }}"


- name: "POOLS | member backup flag preserved in pool host"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_location_presets: {}
    nginx_server_location_preset_defaults: {}
    nginx_server_maintenance: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        upstream_members:
          - name: primary
            address: "10.0.0.1:8080"
          - name: backup
            address: "10.0.0.2:8080"
            backup: true
        upstream_pools:
          - name: web
            members: [primary, backup]
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_hosts"
      ansible.builtin.set_fact:
        nginx_t_hosts: >-
          {{ (_nginx_server_runtime.myapp.upstreams_registry.materialized
              | selectattr('name', 'equalto', 'myapp_web') | first).hosts }}
    - name: "Member backup flag preserved in pool host"
      ansible.builtin.assert:
        that:
          - nginx_t_hosts | selectattr('address', 'equalto', '10.0.0.1:8080')
              | map(attribute='backup') | first == false
          - nginx_t_hosts | selectattr('address', 'equalto', '10.0.0.2:8080')
              | map(attribute='backup') | first == true
        success_msg: "PASS: member backup flag preserved in pool host"
        fail_msg: "FAIL: hosts={{ nginx_t_hosts | to_nice_json }}"
