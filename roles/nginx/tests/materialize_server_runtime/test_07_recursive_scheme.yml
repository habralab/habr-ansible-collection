- name: "RECURSIVE_SCHEME | custom source overrides default $http_x_forwarded_proto"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_location_presets: {}
    nginx_server_location_preset_defaults: {}
    nginx_server_maintenance: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        recursive_scheme_header: true
        recursive_scheme_source: "$http_x_scheme"
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_map"
      ansible.builtin.set_fact:
        nginx_t_map: >-
          {{ _nginx_server_runtime.myapp.maps_registry.derived
             | selectattr('name', 'equalto', 'recursive_scheme') | first }}
    - name: "Custom recursive_scheme_source"
      ansible.builtin.assert:
        that:
          - nginx_t_map.source == '$http_x_scheme'
        success_msg: "PASS: custom recursive_scheme_source '$http_x_scheme' used"
        fail_msg: "FAIL: map source={{ nginx_t_map.source }}"


- name: "RECURSIVE_SCHEME | namespace correctly prefixes target variable"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_location_presets: {}
    nginx_server_location_preset_defaults: {}
    nginx_server_maintenance: {}
    _nginx_all_servers:
      - name: my-api
        server_name: my-api.example.com
        recursive_scheme_header: true
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_map"
      ansible.builtin.set_fact:
        nginx_t_map: >-
          {{ _nginx_server_runtime['my-api'].maps_registry.derived
             | selectattr('name', 'equalto', 'recursive_scheme') | first }}
        nginx_t_header: >-
          {{ _nginx_server_runtime['my-api'].proxy_set_header_registry.derived
             | selectattr('name', 'equalto', 'X-Forwarded-Proto') | first }}
    - name: "Slug my-api to my_api in recursive_scheme target"
      ansible.builtin.assert:
        that:
          - nginx_t_map.target == '$my_api_request_scheme'
          - nginx_t_header.value == '$my_api_request_scheme'
        success_msg: "PASS: 'my-api' slugs to 'my_api', target=$my_api_request_scheme"
        fail_msg: >-
          FAIL: target={{ nginx_t_map.target }}, header value={{ nginx_t_header.value }}
