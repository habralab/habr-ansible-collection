---
# Tests for maintenance trigger compilation.
# Triggers become derived geos/maps that feed into a maintenance_active map.
# The maintenance_active map drives an `if` block returning 503.

- name: "MAINTENANCE | ip_sets trigger produces derived geo block"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
    - "fixtures/ip_sets_catalog.yml"
  vars:
    nginx_only_servers: []
    nginx_server_location_presets: {}
    nginx_server_location_preset_defaults: {}
    nginx_server_maintenance: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        maintenance:
          enabled: false
          triggers:
            - type: ip_sets
              name: office_bypass
              ip_sets: [office_ips]
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_geo"
      ansible.builtin.set_fact:
        nginx_t_geo: >-
          {{ _nginx_server_runtime.myapp.geos_registry.derived
             | selectattr('name', 'equalto', 'office_bypass') | first }}
    - name: "Ip_sets trigger"
      ansible.builtin.assert:
        that:
          - nginx_t_geo is defined
          - nginx_t_geo.target == '$myapp_maintenance_bypass_office_bypass'
          - nginx_t_geo.default == '0'
          - nginx_t_geo.entries | selectattr('match', 'equalto', '10.0.1.0/24')
              | map(attribute='value') | first == '1'
          - nginx_t_geo.entries | selectattr('match', 'equalto', '10.0.2.5/32')
              | map(attribute='value') | first == '1'
        success_msg: "PASS: ip_sets trigger 'office_bypass' compiled to geo block with correct entries"
        fail_msg: "FAIL: geo={{ nginx_t_geo | to_nice_json }}"


