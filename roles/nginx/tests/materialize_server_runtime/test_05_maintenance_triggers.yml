- name: "MAINTENANCE | cookie trigger produces derived map block"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_runtime.yml"
  vars:
    nginx_only_servers: []
    nginx_ip_sets: {}
    nginx_server_location_presets: {}
    nginx_server_location_preset_defaults: {}
    nginx_server_maintenance: {}
    _nginx_all_servers:
      - name: myapp
        server_name: myapp.example.com
        maintenance:
          enabled: false
          triggers:
            - type: cookie
              name: cookie_bypass
              cookie:
                name: maintenance_bypass
                allow_values: ["1", "true"]
  tasks:
    - name: "Run materializer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../../roles/nginx/tasks/materialize_server_runtime.yml"
    - name: "Extract nginx_t_map"
      ansible.builtin.set_fact:
        nginx_t_map: >-
          {{ _nginx_server_runtime.myapp.maps_registry.derived
             | selectattr('name', 'equalto', 'cookie_bypass') | first }}
    - name: "Cookie trigger compiled to map from"
      ansible.builtin.assert:
        that:
          - nginx_t_map.source == '$cookie_maintenance_bypass'
          - nginx_t_map.target == '$myapp_maintenance_bypass_cookie_bypass'
          - nginx_t_map.default == '0'
          - nginx_t_map.entries | selectattr('match', 'equalto', '1')
              | map(attribute='value') | first == '1'
          - nginx_t_map.entries | selectattr('match', 'equalto', 'true')
              | map(attribute='value') | first == '1'
        success_msg: "PASS: cookie trigger compiled to map from '$cookie_maintenance_bypass'"
        fail_msg: "FAIL: map={{ nginx_t_map | to_nice_json }}"


