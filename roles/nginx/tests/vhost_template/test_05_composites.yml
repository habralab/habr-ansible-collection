---
# Tests for remaining composite directives in vhost.j2.
# Covers: add_header (double/single/absent quotes, always flag),
# proxy_cache_status_header (bool/string/mapping),
# error_page (codes list, string entries),
# ssl_files, proxy_cache_valid (string/mapping/codes list),
# if-blocks (set, return, raw; condition filter),
# index, try_files, auth_list, proxy_set_header.
#
# NOTE: locations go in nginx_server_runtime.locations (not item.locations)
# because the template replaces item.locations with runtime.locations when defined.

- name: "ADD_HEADER | default double-quoted with always flag"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations:
        - name: "/"
          add_header:
            - name: X-Frame-Options
              value: SAMEORIGIN
              always: true
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Add_header default double-quoted with always"
      ansible.builtin.assert:
        that:
          - "'add_header X-Frame-Options \"SAMEORIGIN\" always;' in nginx_rendered"
        success_msg: "PASS: add_header default double-quoted with always"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


