        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


- name: "PROXY_SET_HEADER | registry headers rendered alongside proxy_pass"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
      upstream_default_scheme: http
      upstream_default_target: main
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry:
        materialized:
          - name: myapp_main
            hosts:
              - address: "10.0.0.1:8080"
      # proxy_set_header_registry.materialized is the canonical source;
      # the location's proxy_set_header value is overridden by the registry.
      proxy_set_header_registry:
        materialized:
          - name: "Host"
            value: "$host"
          - name: "X-Real-IP"
            value: "$remote_addr"
      if: []
      error_page: []
      locations:
        - name: "/"
          # proxy_pass makes block_has_content return true for the proxy block,
          # ensuring proxy_set_header (from registry) is also rendered.
          proxy_pass: "default"
          proxy_set_header: true
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Proxy_set_header comes from registry, rendered alongside proxy_pass"
      ansible.builtin.assert:
        that:
          - "'proxy_set_header Host $host;' in nginx_rendered"
          - "'proxy_set_header X-Real-IP $remote_addr;' in nginx_rendered"
        success_msg: "PASS: proxy_set_header comes from registry, rendered alongside proxy_pass"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"
