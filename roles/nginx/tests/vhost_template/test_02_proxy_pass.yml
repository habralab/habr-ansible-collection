        materialized:
          - name: myapp_main
            hosts:
              - address: "10.0.0.1:8080"
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations:
        - name: "/"
          proxy_pass:
            default: true
            scheme: https
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Proxy_pass {default:true, scheme:https} → https://myapp_main"
      ansible.builtin.assert:
