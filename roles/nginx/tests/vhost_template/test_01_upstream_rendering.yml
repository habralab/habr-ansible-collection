---
# Tests for upstream block rendering in vhost.j2.
# Covers: ip_hash, host flags (backup, weight, max_fails, fail_timeout, remark),
# state:absent filtering, empty hosts list.

- name: "UPSTREAM | basic upstream block rendered"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry:
        materialized:
          - name: myapp_web1
            hosts:
              - address: "10.0.0.1:8080"
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations: []
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Basic upstream block rendered correctly"
      ansible.builtin.assert:
        that:
          - "'upstream myapp_web1 {' in nginx_rendered"
          - "'\tserver 10.0.0.1:8080;' in nginx_rendered"
        success_msg: "PASS: basic upstream block rendered correctly"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


