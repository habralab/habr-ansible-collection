  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Return text with both quotes → escaped output (no TODO)"
      ansible.builtin.assert:
        that:
          # text has both ' and " → escape path: no simple quoting, falls to escaped double-quotes
          - "'return 200' in nginx_rendered"
          - "'# TODO' not in nginx_rendered"
        success_msg: "PASS: return text with both quotes → escaped output (no TODO)"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


