---
# Tests for location rendering and server-level features in vhost.j2.
# Covers: location modifier, runtime locations override item.locations,
# companion_servers (state:absent, two server blocks),
# proxy_cache_paths (zone name, sizes, state:absent),
# render_directives:false → empty directive output,
# root composite.
#
# NOTE: item.locations is replaced by nginx_server_runtime.locations when
# runtime.locations is defined (even if empty). Tests that use item.locations
# must not define nginx_server_runtime.locations at all.

- name: "LOCATION | modifier rendered in location header"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations:
        - name: "\\.(jpg|png|gif)$"
          modifier: "~*"
          try_files: "$uri =404"
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Location modifier rendered in header"
      ansible.builtin.assert:
        that:
          - "'location ~*' in nginx_rendered"
          - "'try_files $uri =404;' in nginx_rendered"
        success_msg: "PASS: location modifier rendered in header"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


- name: "LOCATION | runtime locations replace item.locations"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
      locations:
        - name: "/item-only"
          return:
            code: 200
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations:
        - name: "/runtime-only"
          return:
            code: 204
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Runtime locations replace item.locations"
      ansible.builtin.assert:
        that:
          - "'location /runtime-only' in nginx_rendered"
          - "'location /item-only' not in nginx_rendered"
        success_msg: "PASS: runtime locations replace item.locations"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


- name: "COMPANION_SERVERS | state:absent companion excluded"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
      companion_servers:
        - server_name: "www.myapp.example.com"
          return:
            code: 301
            url: "https://myapp.example.com$request_uri"
        - server_name: "old.myapp.example.com"
          state: absent
          return:
            code: 301
            url: "https://myapp.example.com$request_uri"
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations: []
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "State:absent companion server excluded"
      ansible.builtin.assert:
        that:
          - "'www.myapp.example.com' in nginx_rendered"
          - "'old.myapp.example.com' not in nginx_rendered"
        success_msg: "PASS: state:absent companion server excluded"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


