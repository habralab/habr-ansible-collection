        that:
          - "'myapp_active' in nginx_rendered"
          - "'myapp_removed' not in nginx_rendered"
        success_msg: "PASS: state:absent cache entry excluded from proxy_cache_path"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


