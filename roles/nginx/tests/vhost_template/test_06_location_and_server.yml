    item:
      name: myapp
      server_name: myapp.example.com
      companion_servers:
        - server_name: "www.myapp.example.com"
          return:
            code: 301
            url: "https://myapp.example.com$request_uri"
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations: []
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Companion server produces second server block"
      ansible.builtin.assert:
        that:
          - "(nginx_rendered | regex_findall('server \\{')) | length == 2"
        success_msg: "PASS: companion server produces second server block"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


- name: "PROXY_CACHE_PATHS | cache block renders proxy_cache_path directives"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
      cache_zones:
        - name: main
          mem_size: "32m"
          disk_size: "4g"
          inactive: "30m"
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry: {materialized: []}
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations: []
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Proxy_cache_path rendered with correct zone name and sizes"
      ansible.builtin.assert:
        that:
          - "'proxy_cache_path /var/cache/nginx/myapp_main' in nginx_rendered"
          - "'keys_zone=myapp_main:32m' in nginx_rendered"
          - "'max_size=4g' in nginx_rendered"
          - "'inactive=30m' in nginx_rendered"
        success_msg: "PASS: proxy_cache_path rendered with correct zone name and sizes"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


- name: "PROXY_CACHE_PATHS | state:absent cache entry excluded"
