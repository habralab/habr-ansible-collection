---
# Tests for map and geo block rendering in vhost.j2.
# Covers: map entries single-quoted, default single-quoted, hostnames/volatile flags,
# state:absent filtering, geo with/without source, ranges, proxy (string and list),
# proxy_recursive, volatile, geo entries, missing target → skipped.

- name: "MAP | map entries and default are single-quoted"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
    nginx_server_runtime:
      geos_registry: {materialized: []}
      maps_registry:
        materialized:
          - name: backend_selector
            source: "$cookie_backend"
            target: "$myapp_backend_selector"
            default: "web"
            entries:
              - match: "v2"
                value: "web_v2"
              - match: "v3"
                value: "web_v3"
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations: []
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Map entries and default are single-quoted"
      ansible.builtin.assert:
        that:
          - "'map $cookie_backend $myapp_backend_selector {' in nginx_rendered"
          - "\"\\tdefault 'web';\" in nginx_rendered"
          - "\"\\t'v2' 'web_v2';\" in nginx_rendered"
          - "\"\\t'v3' 'web_v3';\" in nginx_rendered"
        success_msg: "PASS: map entries and default are single-quoted"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


