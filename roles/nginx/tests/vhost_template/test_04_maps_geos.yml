- name: "GEO | geo with source uses 'geo SOURCE TARGET' syntax"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../../roles/nginx/vars/server_vhost.yml"
  vars:
    nginx_proxy_cache_root: "/var/cache/nginx"
    __nginx_server_vhost_mode:
      render_directives: true
    item:
      name: myapp
      server_name: myapp.example.com
    nginx_server_runtime:
      geos_registry:
        materialized:
          - name: office_geo
            source: "$http_x_real_ip"
            target: "$myapp_is_office"
            default: "0"
            entries:
              - match: "10.0.0.0/8"
                value: "1"
      maps_registry: {materialized: []}
      upstreams_registry: {materialized: []}
      proxy_set_header_registry: {materialized: []}
      if: []
      error_page: []
      locations: []
  tasks:
    - name: "Render vhost template"
      ansible.builtin.set_fact:
        nginx_rendered: "{{ lookup('template', playbook_dir + '/../../../../roles/nginx/templates/servers/vhost.j2') }}"
    - name: "Geo with source uses two-arg syntax"
      ansible.builtin.assert:
        that:
          - "'geo $http_x_real_ip $myapp_is_office {' in nginx_rendered"
          - "'\tdefault 0;' in nginx_rendered"
          - "'\t10.0.0.0/8 1;' in nginx_rendered"
        success_msg: "PASS: geo with source uses two-arg syntax"
        fail_msg: "FAIL: rendered=\n{{ nginx_rendered }}"


