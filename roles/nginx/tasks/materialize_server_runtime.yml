---
- name: "Normalize server selection patterns"
  ansible.builtin.set_fact:
    _nginx_only_servers_patterns: >-
      {% if nginx_only_servers is string %}
      {{ nginx_only_servers.split(',') | map('trim') | reject('equalto', '') | list | to_json }}
      {% else %}
      {{ nginx_only_servers | default([]) | to_json }}
      {% endif %}
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Materialize server selection patterns list"
  ansible.builtin.set_fact:
    _nginx_only_servers_patterns: "{{ (_nginx_only_servers_patterns | trim) | from_json }}"
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Filter selected servers"
  ansible.builtin.set_fact:
    _nginx_selected_servers: >-
      {% set ns = namespace(items=[]) %}
      {% for item in _nginx_all_servers %}
      {% set identities = [
        item.name | default(''),
        item.filename | default(''),
        item.server_name | default('')
      ] | reject('equalto', '') | unique | list %}
      {% set match_ns = namespace(matched=(_nginx_only_servers_patterns | length == 0)) %}
      {% if not match_ns.matched %}
      {% for pattern in _nginx_only_servers_patterns %}
      {% set pattern_regex = '^'
        ~ (pattern
           | replace('\\', '\\\\')
           | replace('.', '\\.')
           | replace('[', '\\[')
           | replace(']', '\\]')
           | replace('(', '\\(')
           | replace(')', '\\)')
           | replace('{', '\\{')
           | replace('}', '\\}')
           | replace('+', '\\+')
           | replace('?', '\\?')
           | replace('^', '\\^')
           | replace('$', '\\$')
           | replace('|', '\\|')
           | replace('*', '.*'))
        ~ '$' %}
      {% if identities | select('match', pattern_regex) | list | length > 0 %}
      {% set match_ns.matched = true %}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% if match_ns.matched %}
      {% set ns.items = ns.items + [item] %}
      {% endif %}
      {% endfor %}
      {{ ns.items | to_json }}
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Materialize selected servers list"
  ansible.builtin.set_fact:
    _nginx_selected_servers: "{{ (_nginx_selected_servers | trim) | from_json }}"
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Assemble server runtime"
  ansible.builtin.set_fact:
    _nginx_server_runtime: >-
      {% set ns = namespace(items={}) %}
      {% for item in _nginx_selected_servers %}
      {# --------------------------------------------------------------------- #}
      {# Identity and feature toggles                                          #}
      {# --------------------------------------------------------------------- #}
      {% set server_key = item.name | default(item.server_name | default(item.filename | default(''))) %}
      {% set identity_ns = namespace(value='') %}
      {% for identity_field in __nginx_server_runtime_identity_fields %}
      {% if identity_ns.value == '' and item[identity_field] is defined %}
      {% set identity_ns.value = item[identity_field] %}
      {% endif %}
      {% endfor %}
      {% set namespace_source = identity_ns.value %}
      {% set generated_namespace = namespace_source
        | lower
        | regex_replace('[^a-z0-9]+', '_')
        | regex_replace('^_+', '')
        | regex_replace('_+$', '') %}
      {% set recursive_scheme_header_raw = item.recursive_scheme_header | default(false) %}
      {% set recursive_scheme_header_config = recursive_scheme_header_raw if recursive_scheme_header_raw is mapping else {} %}
      {% set recursive_scheme_header =
        (recursive_scheme_header_config.enabled | default(true)) | bool
        if recursive_scheme_header_raw is mapping
        else recursive_scheme_header_raw | bool %}
      {% set recursive_scheme_header_defaults = __nginx_server_runtime_feature_defaults.recursive_scheme_header %}
      {% set recursive_scheme_source = recursive_scheme_header_config.source
        | default(item.recursive_scheme_source | default(recursive_scheme_header_defaults.source)) %}
      {% set recursive_scheme_default = recursive_scheme_header_config.default
        | default(item.recursive_scheme_default | default(recursive_scheme_header_defaults.default)) %}
      {% set recursive_scheme_allowed_values = recursive_scheme_header_config.allowed_values
        | default(item.recursive_scheme_allowed_values | default(recursive_scheme_header_defaults.allowed_values)) %}
      {% set recursive_scheme_case_sensitive = recursive_scheme_header_config.case_sensitive
        | default(item.recursive_scheme_case_sensitive | default(recursive_scheme_header_defaults.case_sensitive)) | bool %}
      {% set recursive_scheme_entries_ns = namespace(items=[]) %}
      {% if item.recursive_scheme_entries is defined %}
      {% set recursive_scheme_entries_ns.items = item.recursive_scheme_entries %}
      {% elif recursive_scheme_header_config.entries is defined %}
      {% set recursive_scheme_entries_ns.items = recursive_scheme_header_config.entries %}
      {% else %}
      {% for allowed_value in recursive_scheme_allowed_values if allowed_value is not none %}
      {% set allowed_value_string = allowed_value | string %}
      {% set allowed_value_regex = allowed_value_string
        | replace('\\', '\\\\')
        | replace('.', '\\.')
        | replace('[', '\\[')
        | replace(']', '\\]')
        | replace('(', '\\(')
        | replace(')', '\\)')
        | replace('{', '\\{')
        | replace('}', '\\}')
        | replace('+', '\\+')
        | replace('?', '\\?')
        | replace('^', '\\^')
        | replace('$', '\\$')
        | replace('|', '\\|')
        | replace('*', '\\*') %}
      {% if recursive_scheme_case_sensitive %}
      {% set recursive_scheme_entries_ns.items = recursive_scheme_entries_ns.items + [{
        'match': allowed_value_string,
        'value': allowed_value_string
      }] %}
      {% else %}
      {% set recursive_scheme_entries_ns.items = recursive_scheme_entries_ns.items + [{
        'match': '~*^' ~ allowed_value_regex ~ '$',
        'value': allowed_value_string,
        'raw_match': true
      }] %}
      {% endif %}
      {% endfor %}
      {% endif %}

      {# --------------------------------------------------------------------- #}
      {# Base registries                                                        #}
      {# --------------------------------------------------------------------- #}
      {% set input_upstreams = item.upstreams | default([]) %}
      {% set namespaced_input_upstreams_ns = namespace(items=[]) %}
      {% for upstream in input_upstreams %}
      {% if upstream.name is defined and generated_namespace | length > 0 and not (upstream.name | string).startswith(generated_namespace ~ '_') %}
      {% set namespaced_input_upstreams_ns.items = namespaced_input_upstreams_ns.items + [upstream | combine({
        'name': generated_namespace ~ '_' ~ upstream.name,
        'original_name': upstream.name
      })] %}
      {% else %}
      {% set namespaced_input_upstreams_ns.items = namespaced_input_upstreams_ns.items + [upstream] %}
      {% endif %}
      {% endfor %}
      {% set base_registries = namespace(items={}) %}
      {% for registry_name, registry_spec in __nginx_server_runtime_registry_specs.base.items() %}
      {% set input_items = item[registry_spec.input_field] | default([]) %}
      {% set derived_items = item[registry_spec.derived_field] | default([]) %}
      {% set merged = namespace(items=[], keys=[]) %}
      {% for entry in ((input_items + derived_items) | reverse) %}
      {% set entry_key = entry[registry_spec.key_field] if entry[registry_spec.key_field] is defined else '' %}
      {% if entry_key and entry_key not in merged.keys %}
      {% set merged.items = [entry] + merged.items %}
      {% set merged.keys = merged.keys + [entry_key] %}
      {% endif %}
      {% endfor %}
      {% set base_registries.items = base_registries.items | combine({
        registry_name: {
          'input': input_items,
          'derived': derived_items,
          'materialized': merged.items
        }
      }, recursive=True) %}
      {% endfor %}
      {% set input_upstream_members = base_registries.items.upstream_members.input %}
      {% set derived_upstream_members = base_registries.items.upstream_members.derived %}
      {% set upstream_member_merge = namespace(items=base_registries.items.upstream_members.materialized) %}
      {% set input_upstream_pools = base_registries.items.upstream_pools.input %}
      {% set derived_upstream_pools = base_registries.items.upstream_pools.derived %}
      {% set upstream_pool_merge = namespace(items=base_registries.items.upstream_pools.materialized) %}
      {% set input_upstream_selection = base_registries.items.upstream_selection.input %}
      {% set derived_upstream_selection = base_registries.items.upstream_selection.derived %}
      {% set upstream_selection_merge = namespace(items=base_registries.items.upstream_selection.materialized) %}

      {# --------------------------------------------------------------------- #}
      {# Derived upstreams from members and pools                              #}
      {# --------------------------------------------------------------------- #}
      {% set derived_upstreams_ns = namespace(items=(item._nginx_derived_upstreams | default([]))) %}
      {% if generated_namespace | length > 0 %}
      {% for member in upstream_member_merge.items if member.name is defined and member.address is defined and member.state | default('present') == 'present' %}
      {% set derived_upstreams_ns.items = derived_upstreams_ns.items + [{
        'name': generated_namespace ~ '_' ~ member.name,
        'hosts': [{
          'address': member.address,
          'remark': member.remark | default(member.name)
        }]
      }] %}
      {% endfor %}
      {% for pool in upstream_pool_merge.items if pool.name is defined and pool.state | default('present') == 'present' %}
      {% set pool_hosts_ns = namespace(items=[]) %}
      {% for member_name in pool.members | default([]) %}
      {% for member in upstream_member_merge.items
        if member.name is defined
        and member.name == member_name
        and member.address is defined
        and member.state | default('present') == 'present' %}
      {% set pool_host = {
        'address': member.address,
        'remark': member.remark | default(member.name),
        'backup': member.backup | default(false)
      } %}
      {% if member.weight is defined %}
      {% set pool_host = pool_host | combine({'weight': member.weight}) %}
      {% endif %}
      {% if pool.max_fails is defined %}
      {% set pool_host = pool_host | combine({'max_fails': pool.max_fails}) %}
      {% elif member.max_fails is defined %}
      {% set pool_host = pool_host | combine({'max_fails': member.max_fails}) %}
      {% endif %}
      {% if pool.fail_timeout is defined %}
      {% set pool_host = pool_host | combine({'fail_timeout': pool.fail_timeout}) %}
      {% elif member.fail_timeout is defined %}
      {% set pool_host = pool_host | combine({'fail_timeout': member.fail_timeout}) %}
      {% endif %}
      {% set pool_hosts_ns.items = pool_hosts_ns.items + [pool_host] %}
      {% endfor %}
      {% endfor %}
      {% set derived_upstreams_ns.items = derived_upstreams_ns.items + [{
        'name': generated_namespace ~ '_' ~ pool.name,
        'ip_hash': pool.ip_hash | default(false),
        'hosts': pool_hosts_ns.items
      }] %}
      {% endfor %}
      {% endif %}

      {# --------------------------------------------------------------------- #}
      {# Derived maps: direct input, recursive scheme, upstream selection      #}
      {# --------------------------------------------------------------------- #}
      {% set derived_maps_ns = namespace(items=(item._nginx_derived_maps | default([]))) %}
      {% if recursive_scheme_header and generated_namespace | length > 0 %}
      {% set derived_maps_ns.items = derived_maps_ns.items + [{
        'name': 'recursive_scheme',
        'source': recursive_scheme_source,
        'target': '$' ~ generated_namespace ~ '_' ~ recursive_scheme_header_defaults.target_suffix,
        'default': recursive_scheme_default,
        'entries': recursive_scheme_entries_ns.items
      }] %}
      {% endif %}
      {% if generated_namespace | length > 0 %}
      {% for selection in upstream_selection_merge.items if selection.name is defined and selection.state | default('present') == 'present' %}
      {% if selection.source is defined and selection.source.expression is defined %}
      {% set selection_source = selection.source.expression %}
      {% else %}
      {% set selection_cookie_name = 'backend_override' %}
      {% if selection.source is defined and selection.source.cookie is defined %}
      {% set selection_cookie_name = selection.source.cookie %}
      {% elif selection.source is defined and selection.source.name is defined %}
      {% set selection_cookie_name = selection.source.name %}
      {% endif %}
      {% set selection_source = '$cookie_' ~ selection_cookie_name %}
      {% endif %}
      {% set default_target_ns = namespace(value=selection.default_target | default('')) %}
      {% for pool in upstream_pool_merge.items if pool.name is defined and pool.name == default_target_ns.value %}
      {% set default_target_ns.value = generated_namespace ~ '_' ~ pool.name %}
      {% endfor %}
      {% for member in upstream_member_merge.items if member.name is defined and member.name == default_target_ns.value %}
      {% set default_target_ns.value = generated_namespace ~ '_' ~ member.name %}
      {% endfor %}
      {% for upstream in (namespaced_input_upstreams_ns.items + derived_upstreams_ns.items)
        if upstream.name is defined
        and (
          upstream.name == default_target_ns.value
          or (
            upstream.original_name is defined
            and upstream.original_name == default_target_ns.value
          )
        ) %}
      {% set default_target_ns.value = upstream.name %}
      {% endfor %}
      {% set entries_ns = namespace(items=[]) %}
      {% for selector in selection.selectors | default([]) if selector.value is defined and selector.target is defined %}
      {% set selector_target_ns = namespace(value=selector.target) %}
      {% for pool in upstream_pool_merge.items if pool.name is defined and pool.name == selector_target_ns.value %}
      {% set selector_target_ns.value = generated_namespace ~ '_' ~ pool.name %}
      {% endfor %}
      {% for member in upstream_member_merge.items if member.name is defined and member.name == selector_target_ns.value %}
      {% set selector_target_ns.value = generated_namespace ~ '_' ~ member.name %}
      {% endfor %}
      {% for upstream in (namespaced_input_upstreams_ns.items + derived_upstreams_ns.items)
        if upstream.name is defined
        and (
          upstream.name == selector_target_ns.value
          or (
            upstream.original_name is defined
            and upstream.original_name == selector_target_ns.value
          )
        ) %}
      {% set selector_target_ns.value = upstream.name %}
      {% endfor %}
      {% set entries_ns.items = entries_ns.items + [{
        'match': selector.value,
        'value': selector_target_ns.value
      }] %}
      {% endfor %}
      {% set derived_maps_ns.items = derived_maps_ns.items + [{
        'name': selection.name,
        'source': selection_source,
        'target': '$' ~ generated_namespace ~ '_upstream_selection_' ~ selection.name,
        'default': default_target_ns.value,
        'entries': entries_ns.items
      }] %}
      {% endfor %}
      {% endif %}

      {# --------------------------------------------------------------------- #}
      {# Derived proxy_set_header entries                                      #}
      {# --------------------------------------------------------------------- #}
      {% set derived_proxy_set_headers = item._nginx_derived_proxy_set_header | default([]) %}
      {% if recursive_scheme_header and generated_namespace | length > 0 %}
      {% set derived_proxy_set_headers = derived_proxy_set_headers + [{
        'name': recursive_scheme_header_defaults.proxy_set_header_name,
        'value': '$' ~ generated_namespace ~ '_' ~ recursive_scheme_header_defaults.target_suffix
      }] %}
      {% endif %}

      {# --------------------------------------------------------------------- #}
      {# Derived maintenance artifacts                                          #}
      {# --------------------------------------------------------------------- #}
      {% set derived_if_ns = namespace(items=(item._nginx_derived_if | default([]))) %}
      {% set derived_error_pages_ns = namespace(items=(item._nginx_derived_error_page | default([]))) %}
      {% set derived_geos_ns = namespace(items=(item._nginx_derived_geos | default([]))) %}
      {% set preset_definitions = nginx_server_location_presets | default({}) %}
      {% set preset_default_configs = nginx_server_location_preset_defaults | default({}) %}
      {% set server_preset_configs = item.location_presets | default({}) %}
      {% set derived_locations_ns = namespace(items=(item._nginx_derived_locations | default([]))) %}
      {% if item.maintenance is defined and generated_namespace | length > 0 %}
      {% set maintenance_defaults = nginx_server_maintenance | default({}) %}
      {% set maintenance = maintenance_defaults | combine(item.maintenance | default({}), recursive=True) %}
      {% set maintenance_enabled = maintenance.enabled | default(false) | bool %}
      {% set maintenance_file = maintenance.file | default('/stub_files/503.html') %}
      {% set maintenance_triggers = maintenance.triggers | default([]) %}
      {% set maintenance_bypass_vars_ns = namespace(items=[]) %}
      {% for trigger in maintenance_triggers if trigger.type is defined %}
      {% set trigger_name = (trigger.name | default(trigger.type ~ '_' ~ loop.index))
        | lower
        | regex_replace('[^a-z0-9_]+', '_')
        | regex_replace('^_+', '')
        | regex_replace('_+$', '') %}
      {% set trigger_target = '$' ~ generated_namespace ~ '_maintenance_bypass_' ~ trigger_name %}
      {% if trigger.type == 'ip_sets' %}
      {% set trigger_entries_ns = namespace(items=[]) %}
      {% for ip_set_name in trigger.ip_sets | default([]) %}
      {% for ip_entry in (nginx_ip_sets[ip_set_name] | default([])) %}
      {% if ip_entry.net is defined %}
      {% set trigger_entries_ns.items = trigger_entries_ns.items + [{
        'match': ip_entry.net,
        'value': '1'
      }] %}
      {% elif ip_entry is string %}
      {% set trigger_entries_ns.items = trigger_entries_ns.items + [{
        'match': ip_entry,
        'value': '1'
      }] %}
      {% endif %}
      {% endfor %}
      {% endfor %}
      {% set derived_geos_ns.items = derived_geos_ns.items + [{
        'name': trigger_name,
        'target': trigger_target,
        'default': '0',
        'entries': trigger_entries_ns.items
      }] %}
      {% set maintenance_bypass_vars_ns.items = maintenance_bypass_vars_ns.items + [trigger_target] %}
      {% elif trigger.type == 'cookie' and trigger.cookie is defined and trigger.cookie.name is defined %}
      {% set allow_values = trigger.cookie.allow_values | default(['1']) %}
      {% set allow_entries_ns = namespace(items=[]) %}
      {% for allow_value in allow_values %}
      {% set allow_entries_ns.items = allow_entries_ns.items + [{
        'match': allow_value | string,
        'value': '1'
      }] %}
      {% endfor %}
      {% set derived_maps_ns.items = derived_maps_ns.items + [{
        'name': trigger_name,
        'source': '$cookie_' ~ trigger.cookie.name,
        'target': trigger_target,
        'default': '0',
        'entries': allow_entries_ns.items
      }] %}
      {% set maintenance_bypass_vars_ns.items = maintenance_bypass_vars_ns.items + [trigger_target] %}
      {% elif trigger.type == 'map' and trigger.variable is defined %}
      {% set allow_values = trigger.allow_values | default(['1']) %}
      {% set allow_entries_ns = namespace(items=[]) %}
      {% for allow_value in allow_values %}
      {% set allow_entries_ns.items = allow_entries_ns.items + [{
        'match': allow_value | string,
        'value': '1'
      }] %}
      {% endfor %}
      {% set derived_maps_ns.items = derived_maps_ns.items + [{
        'name': trigger_name,
        'source': trigger.variable,
        'target': trigger_target,
        'default': '0',
        'entries': allow_entries_ns.items
      }] %}
      {% set maintenance_bypass_vars_ns.items = maintenance_bypass_vars_ns.items + [trigger_target] %}
      {% endif %}
      {% endfor %}
      {% set maintenance_switch_target = '$' ~ generated_namespace ~ '_maintenance_switch' %}
      {% set derived_maps_ns.items = derived_maps_ns.items + [{
        'name': 'maintenance_switch',
        'source': '$request_method',
        'target': maintenance_switch_target,
        'default': (maintenance_enabled | ternary('1', '0')),
        'entries': []
      }] %}
      {% set maintenance_bypass_var = '' %}
      {% if maintenance_bypass_vars_ns.items | length == 1 %}
      {% set maintenance_bypass_var = maintenance_bypass_vars_ns.items[0] %}
      {% elif maintenance_bypass_vars_ns.items | length > 1 %}
      {% set combined_bypass_ns = namespace(current=maintenance_bypass_vars_ns.items[0]) %}
      {% for combine_right in maintenance_bypass_vars_ns.items[1:] %}
      {% set combine_target = '$' ~ generated_namespace ~ '_maintenance_bypass_combined_' ~ loop.index %}
      {% set derived_maps_ns.items = derived_maps_ns.items + [{
        'name': 'maintenance_bypass_combined_' ~ loop.index,
        'source': '"' ~ combined_bypass_ns.current ~ ':' ~ combine_right ~ '"',
        'target': combine_target,
        'default': '0',
        'entries': [
          {'match': '1:0', 'value': '1'},
          {'match': '0:1', 'value': '1'},
          {'match': '1:1', 'value': '1'}
        ]
      }] %}
      {% set combined_bypass_ns.current = combine_target %}
      {% endfor %}
      {% set maintenance_bypass_var = combined_bypass_ns.current %}
      {% endif %}
      {% set maintenance_active_target = '$' ~ generated_namespace ~ '_maintenance_active' %}
      {% if maintenance_bypass_var %}
      {% set maintenance_active_source = '"' ~ maintenance_switch_target ~ ':' ~ maintenance_bypass_var ~ '"' %}
      {% set maintenance_active_entries = [
        {'match': '1:0', 'value': '1'},
        {'match': '1:1', 'value': '0'}
      ] %}
      {% else %}
      {% set maintenance_active_source = maintenance_switch_target %}
      {% set maintenance_active_entries = [
        {'match': '1', 'value': '1'}
      ] %}
      {% endif %}
      {% set derived_maps_ns.items = derived_maps_ns.items + [{
        'name': 'maintenance_active',
        'source': maintenance_active_source,
        'target': maintenance_active_target,
        'default': '0',
        'entries': maintenance_active_entries
      }] %}
      {% set derived_if_ns.items = derived_if_ns.items + [{
        'condition': maintenance_active_target ~ ' = 1',
        'return': {'code': 503}
      }] %}
      {% set derived_error_pages_ns.items = derived_error_pages_ns.items + [{
        'codes': 503,
        'target': '@maintenance'
      }] %}
      {% set derived_locations_ns.items = derived_locations_ns.items + [{
        'name': '@maintenance',
        'rewrite': [{
          'regex': '^(.*)$',
          'replacement': maintenance_file,
          'flag': 'break'
        }]
      }] %}
      {% endif %}

      {# --------------------------------------------------------------------- #}
      {# Derived locations from reusable presets                               #}
      {# --------------------------------------------------------------------- #}
      {% for preset_name, preset_definition in preset_definitions.items() %}
      {% set preset_default_config = preset_default_configs[preset_name] if preset_default_configs[preset_name] is defined else {} %}
      {% set server_preset_config = server_preset_configs[preset_name] if server_preset_configs[preset_name] is defined else {} %}
      {% set preset_explicit_config = (preset_default_configs[preset_name] is defined) or (server_preset_configs[preset_name] is defined) %}
      {% set preset_effective_config = preset_default_config | combine(server_preset_config, recursive=True) %}
      {% set preset_enabled = preset_effective_config.enabled | default(preset_explicit_config) | bool %}
      {% if preset_definition.location is defined %}
      {% set preset_location = preset_definition.location %}
      {% else %}
      {% set preset_location = preset_definition %}
      {% endif %}
      {% set preset_override_location = preset_effective_config.location | default({}) %}
      {% set preset_materialized_location = preset_location | combine(preset_override_location, recursive=True) %}
      {% if preset_enabled and preset_materialized_location.name is defined %}
      {% set derived_locations_ns.items = derived_locations_ns.items + [preset_materialized_location] %}
      {% endif %}
      {% endfor %}
      {% set explicit_locations = item.locations | default([]) %}
      {% set materialized_locations_merge = namespace(items=[], keys=[]) %}
      {% for location in ((derived_locations_ns.items + explicit_locations) | reverse) %}
      {% set location_key = location.name if location.name is defined else '' %}
      {% if location_key and location_key not in materialized_locations_merge.keys %}
      {% set materialized_locations_merge.items = [location] + materialized_locations_merge.items %}
      {% set materialized_locations_merge.keys = materialized_locations_merge.keys + [location_key] %}
      {% endif %}
      {% endfor %}
      {% set materialized_if = derived_if_ns.items + (item['if'] | default([])) %}
      {% set explicit_error_pages = item.error_page | default([]) %}
      {% set materialized_error_pages_merge = namespace(items=[], keys=[]) %}
      {% for page in ((derived_error_pages_ns.items + explicit_error_pages) | reverse) %}
      {% if page is mapping and page.target is defined and (page.codes is defined or page.code is defined) %}
      {% set page_codes = page.codes if page.codes is defined else page.code %}
      {% set page_codes_list = page_codes if page_codes is sequence and page_codes is not string else [page_codes] %}
      {% set page_key = (page_codes_list | map('string') | join(' ')) ~ '|' ~ page.target %}
      {% elif page is string %}
      {% set page_key = page %}
      {% else %}
      {% set page_key = '' %}
      {% endif %}
      {% if page_key and page_key not in materialized_error_pages_merge.keys %}
      {% set materialized_error_pages_merge.items = [page] + materialized_error_pages_merge.items %}
      {% set materialized_error_pages_merge.keys = materialized_error_pages_merge.keys + [page_key] %}
      {% endif %}
      {% endfor %}

      {# --------------------------------------------------------------------- #}
      {# Final geo registry source                                             #}
      {# --------------------------------------------------------------------- #}
      {% set input_geos = item.geos | default([]) %}
      {% set namespaced_input_geos_ns = namespace(items=[]) %}
      {% for geo in input_geos %}
      {% set geo_target_suffix = '' %}
      {% if geo.target is defined and (geo.target | string | length > 0) %}
      {% set geo_target_suffix = (geo.target | string)
        | regex_replace('^\\$', '')
        | lower
        | regex_replace('[^a-z0-9_]+', '_')
        | regex_replace('^_+', '')
        | regex_replace('_+$', '') %}
      {% elif geo.name is defined and (geo.name | string | length > 0) %}
      {% set geo_target_suffix = (geo.name | string)
        | lower
        | regex_replace('[^a-z0-9_]+', '_')
        | regex_replace('^_+', '')
        | regex_replace('_+$', '') %}
      {% endif %}
      {% if generated_namespace | length > 0 and geo_target_suffix | length > 0 %}
      {% set namespaced_input_geos_ns.items = namespaced_input_geos_ns.items + [geo | combine({
        'target': '$' ~ generated_namespace ~ '_' ~ geo_target_suffix
      })] %}
      {% else %}
      {% set namespaced_input_geos_ns.items = namespaced_input_geos_ns.items + [geo] %}
      {% endif %}
      {% endfor %}
      {# --------------------------------------------------------------------- #}
      {# Final registries                                                       #}
      {# --------------------------------------------------------------------- #}
      {% set final_registry_sources = {
        'geos': {
          'input': namespaced_input_geos_ns.items,
          'derived': derived_geos_ns.items
        },
        'maps': {
          'input': item.maps | default([]),
          'derived': derived_maps_ns.items
        },
        'upstreams': {
          'input': namespaced_input_upstreams_ns.items,
          'derived': derived_upstreams_ns.items
        },
        'proxy_set_header': {
          'input': item.proxy_set_header | default([]),
          'derived': derived_proxy_set_headers
        }
      } %}
      {% set final_registries = namespace(items={}) %}
      {% for registry_name, registry_spec in __nginx_server_runtime_registry_specs.final.items() %}
      {% set source = final_registry_sources[registry_name] %}
      {% set merged = namespace(items=[], keys=[]) %}
      {% for entry in ((source.input + source.derived) | reverse) %}
      {% set entry_key = entry[registry_spec.key_field] if entry[registry_spec.key_field] is defined else '' %}
      {% if entry_key and entry_key not in merged.keys %}
      {% set merged.items = [entry] + merged.items %}
      {% set merged.keys = merged.keys + [entry_key] %}
      {% endif %}
      {% endfor %}
      {% set final_registries.items = final_registries.items | combine({
        registry_name: {
          'input': source.input,
          'derived': source.derived,
          'materialized': merged.items
        }
      }, recursive=True) %}
      {% endfor %}

      {# --------------------------------------------------------------------- #}
      {# Final sidecar runtime payload                                         #}
      {# --------------------------------------------------------------------- #}
      {% if server_key %}
      {% set ns.items = ns.items | combine({
        server_key: {
          'geos_registry': final_registries.items.geos,
          'maps_registry': final_registries.items.maps,
          'upstreams_registry': final_registries.items.upstreams,
          'upstream_members_registry': base_registries.items.upstream_members,
          'upstream_pools_registry': base_registries.items.upstream_pools,
          'upstream_selection_registry': base_registries.items.upstream_selection,
          'proxy_set_header_registry': final_registries.items.proxy_set_header,
          'if': materialized_if,
          'error_page': materialized_error_pages_merge.items,
          'locations': materialized_locations_merge.items
        }
      }, recursive=True) %}
      {% endif %}
      {% endfor %}
      {{ ns.items | to_json }}
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Normalize server runtime"
  ansible.builtin.set_fact:
    _nginx_server_runtime: "{{ (_nginx_server_runtime | trim) | from_json }}"
  tags:
    - nginx
    - nginx-config
    - nginx-servers
