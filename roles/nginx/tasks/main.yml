---
- name: "Merge repositories configuration"
  ansible.builtin.set_fact:
    _nginx_repos_merged: "{{ __nginx_repositories_defaults | combine(nginx_repositories, recursive=True) }}"
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Determine active repository"
  ansible.builtin.set_fact:
    _nginx_active_repo: >-
      {{
        (_nginx_repos_merged | dict2items
         | selectattr('value.enabled', 'equalto', true)
         | map(attribute='key')
         | list
         | first)
         | default('ubuntu', true)
      }}
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Set active layout and runtime user from dictionary"
  ansible.builtin.set_fact:
    _nginx_active_layout: "{{ _nginx_repos_merged[_nginx_active_repo].layout }}"
    _nginx_runtime_user: >-
      {{
        nginx_user | default(__nginx_layouts_config[_nginx_repos_merged[_nginx_active_repo].layout].runtime_user, true)
      }}
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Validate input variables and repositories structure"
  ansible.builtin.assert:
    that:
      - _nginx_repos_merged is mapping
      - nginx_packages is sequence and nginx_packages is not string
      - nginx_remove_packages is sequence and nginx_remove_packages is not string
    fail_msg: >-
      _nginx_repos_merged must be a dictionary.
      nginx_packages and nginx_remove_packages must be lists.
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Configure nginx APT repository via helper role"
  ansible.builtin.include_role:
    name: habr.linuxhost.apt_repo
    apply:
      tags:
        - nginx-debug
        - nginx
        - apt
  loop: "{{ _nginx_repos_merged | dict2items }}"
  loop_control:
    loop_var: nginx_repo_item
    label: "{{ nginx_repo_item.key }} (enabled: {{ nginx_repo_item.value.enabled }})"
  vars:
    apt_repo_config: >-
      {{
        nginx_repo_item.value.config | combine({
          'state': nginx_repo_item.value.enabled | ternary('present', 'absent')
        })
      }}
  when: nginx_repo_manage | bool
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Force handler execution to update APT cache immediately"
  ansible.builtin.meta: flush_handlers
  when: nginx_repo_manage | bool
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Determine final list of nginx packages"
  ansible.builtin.set_fact:
    _nginx_final_packages: >-
      {{
        nginx_packages if (nginx_packages | length > 0)
        else (_nginx_repos_merged[_nginx_active_repo].packages | default(__nginx_default_packages))
      }}
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Remove specified nginx packages"
  ansible.builtin.apt:
    name: "{{ nginx_remove_packages }}"
    state: absent
    purge: true
  become: true
  when: nginx_remove_packages | length > 0
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Install nginx packages"
  ansible.builtin.apt:
    name: "{{ _nginx_final_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Create etc directories"
  ansible.builtin.file:
    path: "/etc/nginx/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ [''] + __nginx_layouts_config[_nginx_active_layout].dirs }}"
  become: true
  tags:
    - nginx-debug
    - nginx-config
    - nginx

- name: "Deploy core configuration files for layout {{ _nginx_active_layout }}"
  ansible.builtin.template:
    src: "layouts/{{ _nginx_active_layout }}/{{ item }}.j2"
    dest: "/etc/nginx/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ __nginx_layouts_config[_nginx_active_layout].core_files }}"
  notify: Reload nginx
  become: true
  tags:
    - nginx-debug
    - nginx-config
    - nginx

- name: "Ensure directory for DH param exists"
  ansible.builtin.file:
    path: "{{ nginx_ssl_dhparam_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: nginx_ssl_dhparam_file is defined
  tags:
    - nginx-debug
    - nginx-config
    - nginx-ssl
    - nginx

- name: "Generate DH param"
  ansible.builtin.command:
    cmd: "openssl dhparam -out {{ nginx_ssl_dhparam_file }} {{ nginx_ssl_dhparam_size | int }}"
    creates: "{{ nginx_ssl_dhparam_file }}"
  notify: Reload nginx
  become: true
  when: nginx_ssl_dhparam_file is defined
  tags:
    - nginx-debug
    - nginx-config
    - nginx-ssl
    - nginx

# started legacy tasks
- name: "Create working directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_working_owner }}"
    group: "{{ nginx_working_group }}"
    mode: "0775"
  loop:
    - '/var/log/nginx'
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Delete unnecessary files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/conf.d/gzip.conf
    - /etc/nginx/conf.d/log.conf
    - /etc/nginx/sites-enabled/000_default
    - /etc/nginx/sites-enabled/000_status
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Create config files"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/nginx/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 'conf.d/realip.conf'
    - 'conf.d/ssl.conf'
    - 'sites-available/default'
    - 'sites-available/status'
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Install default servernames"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}"
    dest: "/etc/nginx/sites-enabled/{{ item }}"
    state: link
    owner: root
    group: root
    mode: "0644"
  loop:
    - default
    - status
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Add nginx user to shared group"
  ansible.builtin.user:
    name: nginx
    groups: www-data
    append: true
  notify: Restart nginx
  become: true
  tags:
    - nginx
