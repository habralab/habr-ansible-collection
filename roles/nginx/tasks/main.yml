---
- name: "Merge repositories configuration"
  ansible.builtin.set_fact:
    _nginx_repos_merged: "{{ __nginx_repositories_defaults | combine(nginx_repositories, recursive=True) }}"
  tags:
    - nginx
    - apt
    - nginx-config
    - nginx-includes
    - nginx-auth
    - nginx-servers
    - nginx-ssl
    - nginx-cleanup
    - user
    - logs
    - logrotate

- name: "Determine active repository"
  ansible.builtin.set_fact:
    _nginx_active_repo: >-
      {{
        (_nginx_repos_merged | dict2items
         | selectattr('value.enabled', 'equalto', true)
         | map(attribute='key')
         | list
         | first)
         | default('ubuntu', true)
      }}
  tags:
    - nginx
    - apt
    - nginx-config
    - nginx-includes
    - nginx-auth
    - nginx-servers
    - nginx-ssl
    - nginx-cleanup
    - user
    - logs
    - logrotate

- name: "Set active layout and runtime user/group from dictionary"
  ansible.builtin.set_fact:
    _nginx_active_layout: "{{ _nginx_repos_merged[_nginx_active_repo].layout }}"
    _nginx_runtime_user: >-
      {{
        nginx_user | default(__nginx_layouts_config[_nginx_repos_merged[_nginx_active_repo].layout].runtime_user, true)
      }}
    _nginx_runtime_group: >-
      {{
        nginx_group | default(__nginx_layouts_config[_nginx_repos_merged[_nginx_active_repo].layout].runtime_group, true)
      }}
  tags:
    - nginx
    - apt
    - nginx-config
    - nginx-includes
    - nginx-auth
    - nginx-servers
    - nginx-ssl
    - nginx-cleanup
    - user
    - logs
    - logrotate

- name: "Validate input variables and repositories structure"
  ansible.builtin.assert:
    that:
      - _nginx_repos_merged is mapping
      - nginx_packages is sequence and nginx_packages is not string
      - nginx_remove_packages is sequence and nginx_remove_packages is not string
      - nginx_only_servers is string or (nginx_only_servers is sequence and nginx_only_servers is not string)
      - nginx_server_location_presets is mapping
      - nginx_server_location_preset_defaults is mapping
      - nginx_server_maintenance is mapping
      - nginx_auth is sequence and nginx_auth is not string
      - nginx_auth_passwd_list is sequence and nginx_auth_passwd_list is not string
      - nginx_geos is sequence and nginx_geos is not string
      - nginx_maps is sequence and nginx_maps is not string
    fail_msg: >-
      _nginx_repos_merged must be a dictionary.
      nginx_server_location_presets, nginx_server_location_preset_defaults, and nginx_server_maintenance must be dictionaries.
      nginx_packages, nginx_remove_packages, nginx_auth, nginx_auth_passwd_list, nginx_geos, and nginx_maps must be lists.
      nginx_only_servers must be a string or a list of strings.
  tags:
    - nginx
    - apt

- name: "Assemble global maps registry"
  ansible.builtin.set_fact:
    _nginx_maps_registry: >-
      {% set input_maps = nginx_maps | default([]) %}
      {% set derived_maps = [] %}
      {% set merge_ns = namespace(items=[], keys=[]) %}
      {% for map in ((input_maps + derived_maps) | reverse) %}
      {% set map_key = map.target | default(map.name | default('')) %}
      {% if map_key and map_key not in merge_ns.keys %}
      {% set merge_ns.items = [map] + merge_ns.items %}
      {% set merge_ns.keys = merge_ns.keys + [map_key] %}
      {% endif %}
      {% endfor %}
      {{
        {
          'input': input_maps,
          'derived': derived_maps,
          'materialized': merge_ns.items
        }
      }}
  tags:
    - nginx
    - nginx-config

- name: "Assemble global geos registry"
  ansible.builtin.set_fact:
    _nginx_geos_registry: >-
      {% set input_geos = nginx_geos | default([]) %}
      {% set derived_geos = [] %}
      {% set merge_ns = namespace(items=[], keys=[]) %}
      {% for geo in ((input_geos + derived_geos) | reverse) %}
      {% set geo_key = geo.target | default(geo.name | default('')) %}
      {% if geo_key and geo_key not in merge_ns.keys %}
      {% set merge_ns.items = [geo] + merge_ns.items %}
      {% set merge_ns.keys = merge_ns.keys + [geo_key] %}
      {% endif %}
      {% endfor %}
      {{
        {
          'input': input_geos,
          'derived': derived_geos,
          'materialized': merge_ns.items
        }
      }}
  tags:
    - nginx
    - nginx-config

- name: "Configure nginx APT repository via helper role"
  ansible.builtin.include_role:
    name: habr.linuxhost.apt_repo
    apply:
      tags:
        - nginx
        - apt
  loop: "{{ _nginx_repos_merged | dict2items }}"
  loop_control:
    loop_var: nginx_repo_item
    label: "{{ nginx_repo_item.key }} (enabled: {{ nginx_repo_item.value.enabled }})"
  vars:
    apt_repo_config: >-
      {{
        (nginx_repo_item.value.config | default({})) | combine({
          'state': nginx_repo_item.value.enabled | ternary('present', 'absent')
        })
      }}
  when:
    - nginx_repo_manage | bool
    - nginx_repo_item.value.config is defined
  tags:
    - nginx
    - apt

- name: "Force handler execution to update APT cache immediately"
  ansible.builtin.meta: flush_handlers
  when: nginx_repo_manage | bool
  tags:
    - nginx
    - apt

- name: "Determine final list of nginx packages"
  ansible.builtin.set_fact:
    _nginx_final_packages: >-
      {{
        nginx_packages if (nginx_packages | length > 0)
        else (_nginx_repos_merged[_nginx_active_repo].packages | default(__nginx_default_packages))
      }}
  tags:
    - nginx
    - apt

- name: "Remove specified nginx packages"
  ansible.builtin.apt:
    name: "{{ nginx_remove_packages }}"
    state: absent
    purge: true
  become: true
  when: nginx_remove_packages | length > 0
  tags:
    - nginx
    - apt

- name: "Install nginx packages"
  ansible.builtin.apt:
    name: "{{ _nginx_final_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags:
    - nginx
    - apt

- name: "Create etc directories"
  ansible.builtin.file:
    path: "/etc/nginx/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ [''] + __nginx_layouts_config[_nginx_active_layout].dirs }}"
  become: true
  tags:
    - nginx
    - nginx-config
    - user

- name: "Ensure Nginx includes: directory exists"
  ansible.builtin.file:
    path: "/etc/nginx/includes"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: nginx_auth | length > 0
  tags:
    - nginx
    - nginx-config
    - nginx-includes

- name: "Deploy core configuration files for layout {{ _nginx_active_layout }}"
  ansible.builtin.template:
    src: "layouts/{{ _nginx_active_layout }}/{{ item }}.j2"
    dest: "/etc/nginx/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ __nginx_layouts_config[_nginx_active_layout].core_files }}"
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - user

- name: "Evaluate and deploy active drop-ins"
  ansible.builtin.template:
    src: "drop-ins/{{ item.value.template | default(item.key) }}.conf.j2"
    dest: "/etc/nginx/conf.d/{{ item.key }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ __nginx_dropins | dict2items }}"
  when:
    - q('varnames', item.value.triggers | join('|')) | length > 0
    - item.key != 'geos' or (_nginx_geos_registry.materialized | default(nginx_geos) | length > 0)
    - item.key != 'maps' or (_nginx_maps_registry.materialized | default(nginx_maps) | length > 0)
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - user

- name: "Remove inactive drop-ins"
  ansible.builtin.file:
    path: "/etc/nginx/conf.d/{{ item.key }}.conf"
    state: absent
  loop: "{{ __nginx_dropins | dict2items }}"
  when: >-
    q('varnames', item.value.triggers | join('|')) | length == 0 or
    (
      item.key == 'geos' and
      (_nginx_geos_registry.materialized | default(nginx_geos) | length == 0)
    ) or
    (
      item.key == 'maps' and
      (_nginx_maps_registry.materialized | default(nginx_maps) | length == 0)
    )
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config

- name: "Deploy Nginx includes: auth passwd files"
  ansible.builtin.template:
    src: "includes/auth.passwd.j2"
    dest: "/etc/nginx/includes/auth.{{ item.name }}.passwd"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_auth }}"
  when:
    - item.state | default('present') == 'present'
    - item.basic is defined
    - item.basic.passwd_lists is defined
    - item.basic.passwd_lists | length > 0
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-auth

- name: "Remove Nginx includes: auth passwd files"
  ansible.builtin.file:
    path: "/etc/nginx/includes/auth.{{ item.name }}.passwd"
    state: absent
  loop: "{{ nginx_auth }}"
  when: >-
    item.state | default('present') == 'absent' or
    item.basic is not defined or
    item.basic.passwd_lists is not defined or
    item.basic.passwd_lists | length == 0
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-auth

- name: "Deploy Nginx includes: auth include files"
  ansible.builtin.template:
    src: "includes/auth.include.j2"
    dest: "/etc/nginx/includes/auth.{{ item.name }}.include"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_auth }}"
  when: item.state | default('present') == 'present'
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-auth

- name: "Remove Nginx includes: auth include files"
  ansible.builtin.file:
    path: "/etc/nginx/includes/auth.{{ item.name }}.include"
    state: absent
  loop: "{{ nginx_auth }}"
  when: item.state | default('present') == 'absent'
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-auth

- name: "Merge default and user-defined servers"
  ansible.builtin.set_fact:
    _nginx_all_servers: >-
      {{
        (
          (__nginx_layouts_config[_nginx_active_layout].default_servers | default([])) +
          (nginx_servers | default([]))
        )
        | reverse
        | unique(attribute='name')
        | reverse
        | list
      }}
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Load server runtime compiler variables"
  ansible.builtin.include_vars:
    file: "server_runtime.yml"
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Materialize server runtime"
  ansible.builtin.import_tasks: "materialize_server_runtime.yml"

- name: "Determine active server template spec files"
  ansible.builtin.set_fact:
    _nginx_active_server_template_spec_files: >-
      {% set ns = namespace(files=[]) %}
      {% for item in _nginx_all_servers %}
      {% set template_name = item.template | default(item.name) %}
      {% if item.state | default('present') == 'present' and __nginx_server_template_specs[template_name] is defined %}
      {% set ns.files = ns.files + [__nginx_server_template_specs[template_name].vars_file] %}
      {% endif %}
      {% endfor %}
      {{ ns.files | unique | to_json }}
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Load internal server template spec files"
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop: "{{ (_nginx_active_server_template_spec_files | trim) | from_json }}"
  when: _nginx_active_server_template_spec_files | trim | length > 0
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Materialize server runtime cache directories"
  ansible.builtin.import_tasks: "materialize_server_runtime_cache.yml"

- name: "Report SSL provisioning requests (not implemented yet)"
  ansible.builtin.debug:
    msg: >-
      SSL provisioning requested for server {{ item.name | default(item.server_name | default('unnamed')) }},
      but provision tasks are not implemented yet. Request:
      {{ item.ssl_provisioning | to_nice_json }}
  loop: "{{ _nginx_selected_servers }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default('unnamed')) }}"
  when:
    - item.state | default('present') == 'present'
    - item.ssl_provisioning is defined
    - item.ssl_provisioning.enabled | default(false) | bool
  changed_when: false
  tags:
    - nginx
    - nginx-config
    - nginx-servers
    - nginx-ssl

- name: "Ensure Nginx server config directories exist"
  ansible.builtin.file:
    path: >-
      {{ item.server_dir | default(nginx_server_dir | default(__nginx_layouts_config[_nginx_active_layout].server_dir)) }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ _nginx_selected_servers }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default(item.filename | default('unnamed'))) }}"
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Ensure Nginx server symlink directories exist"
  ansible.builtin.file:
    path: >-
      {{ item.server_symlink_dir | default(nginx_server_symlink_dir | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_dir)) }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ _nginx_selected_servers }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default(item.filename | default('unnamed'))) }}"
  when:
    - item.server_symlink_enable | default(nginx_server_symlink_enable | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_enable)) | bool
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Deploy Nginx server templates"
  ansible.builtin.template:
    src: "{{ item.template | default(item.name) }}.j2"
    dest: >-
      {{ item.server_dir | default(nginx_server_dir | default(__nginx_layouts_config[_nginx_active_layout].server_dir)) }}/{{
      item.filename | default(item.name) }}{{
      item.server_ext | default(nginx_server_ext | default(__nginx_layouts_config[_nginx_active_layout].server_ext)) }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _nginx_selected_servers }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default(item.filename | default('unnamed'))) }}"
  vars:
    nginx_server_runtime: >-
      {{
        _nginx_server_runtime[
          item.name | default(item.server_name | default(item.filename | default('')))
        ] | default({})
      }}
  when: item.state | default('present') == 'present'
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Manage Nginx server symlinks"
  ansible.builtin.file:
    src: >-
      {{ item.server_dir | default(nginx_server_dir | default(__nginx_layouts_config[_nginx_active_layout].server_dir)) }}/{{
      item.filename | default(item.name) }}{{
      item.server_ext | default(nginx_server_ext | default(__nginx_layouts_config[_nginx_active_layout].server_ext)) }}
    dest: >-
      {{ item.server_symlink_dir | default(nginx_server_symlink_dir | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_dir)) }}/{{
      item.symlink_prefix | default(nginx_server_symlink_prefix | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_prefix)) }}{{
      item.filename | default(item.name) }}{{
      item.server_symlink_ext | default(nginx_server_symlink_ext | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_ext)) }}
    state: link
  loop: "{{ _nginx_selected_servers }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default(item.filename | default('unnamed'))) }}"
  when:
    - item.state | default('present') == 'present'
    - item.server_symlink_enable | default(nginx_server_symlink_enable | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_enable)) | bool
  notify: Reload nginx
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Remove Nginx server symlinks (if absent)"
  ansible.builtin.file:
    path: >-
      {{ item.server_symlink_dir | default(nginx_server_symlink_dir | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_dir)) }}/{{
      item.symlink_prefix | default(nginx_server_symlink_prefix | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_prefix)) }}{{
      item.filename | default(item.name) }}{{
      item.server_symlink_ext | default(nginx_server_symlink_ext | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_ext)) }}
    state: absent
  loop: "{{ _nginx_selected_servers }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default(item.filename | default('unnamed'))) }}"
  when:
    - item.state | default('present') == 'absent'
    - item.server_symlink_enable | default(nginx_server_symlink_enable | default(__nginx_layouts_config[_nginx_active_layout].server_symlink_enable)) | bool
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-servers

- name: "Remove Nginx server configs (if absent)"
  ansible.builtin.file:
    path: >-
      {{ item.server_dir | default(nginx_server_dir | default(__nginx_layouts_config[_nginx_active_layout].server_dir)) }}/{{
      item.filename | default(item.name) }}{{
      item.server_ext | default(nginx_server_ext | default(__nginx_layouts_config[_nginx_active_layout].server_ext)) }}
    state: absent
  loop: "{{ _nginx_selected_servers }}"
  loop_control:
    label: "{{ item.name | default(item.server_name | default(item.filename | default('unnamed'))) }}"
  when: item.state | default('present') == 'absent'
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-servers

# TBD

- name: "Ensure directory for DH param exists"
  ansible.builtin.file:
    path: "{{ nginx_ssl_dhparam_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: nginx_ssl_dhparam_file is defined
  tags:
    - nginx
    - nginx-config
    - nginx-ssl
    - user

- name: "Generate DH param"
  ansible.builtin.command:
    cmd: "openssl dhparam -out {{ nginx_ssl_dhparam_file }} {{ nginx_ssl_dhparam_size | int }}"
    creates: "{{ nginx_ssl_dhparam_file }}"
  notify: Reload nginx
  become: true
  when: nginx_ssl_dhparam_file is defined
  tags:
    - nginx
    - nginx-config
    - nginx-ssl

- name: "Ensure working directories exist with correct permissions"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(_nginx_runtime_user) }}"
    group: "{{ item.group | default(_nginx_runtime_group) }}"
    mode: "{{ item.mode | default('0755') }}"
    recurse: "{{ item.recurse | default(false) | bool }}"
  loop: "{{ _nginx_effective_working_dirs }}"
  become: true
  tags:
    - nginx
    - nginx-config
    - nginx-servers
    - user

- name: "Ensure runtime user is in required extra groups"
  ansible.builtin.user:
    name: "{{ _nginx_runtime_user }}"
    groups: "{{ nginx_extra_groups }}"
    append: true
  notify: Restart nginx
  become: true
  when: nginx_extra_groups | length > 0
  tags:
    - nginx
    - nginx-config
    - user

- name: "Deploy logrotate configuration"
  ansible.builtin.template:
    src: "layouts/{{ _nginx_active_layout }}/logrotate.j2"
    dest: "/etc/logrotate.d/nginx"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - nginx
    - nginx-config
    - user
    - logs
    - logrotate

- name: "Find all existing Nginx log files"
  ansible.builtin.find:
    paths: /var/log/nginx
    file_type: file
    patterns: "*.log"
  register: _nginx_logs_paths
  become: true
  tags:
    - nginx
    - nginx-config
    - user
    - logs

- name: "Comb Nginx log files ownership"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ _nginx_runtime_user }}"
    group: "{{ __nginx_layouts_config[_nginx_active_layout].log_group }}"
  loop: "{{ _nginx_logs_paths.files }}"
  when: >
    item.pw_name != _nginx_runtime_user or
    item.gr_name != __nginx_layouts_config[_nginx_active_layout].log_group
  become: true
  tags:
    - nginx
    - nginx-config
    - user
    - logs

- name: "Cleanup obsolete or user-defined paths"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ nginx_cleanup_paths }}"
  become: true
  notify: Reload nginx
  tags:
    - nginx
    - nginx-config
    - nginx-servers
    - nginx-cleanup
