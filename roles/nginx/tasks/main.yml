---
- name: "Merge repositories configuration"
  ansible.builtin.set_fact:
    _nginx_repos_merged: "{{ __nginx_repositories_defaults | combine(nginx_repositories, recursive=True) }}"
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Validate input variables and repositories structure"
  ansible.builtin.assert:
    that:
      - _nginx_repos_merged is mapping
      - nginx_packages is sequence and nginx_packages is not string
      - nginx_remove_packages is sequence and nginx_remove_packages is not string
    fail_msg: >-
      _nginx_repos_merged must be a dictionary.
      nginx_packages and nginx_remove_packages must be lists.
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Configure nginx APT repository via helper role"
  ansible.builtin.include_role:
    name: habr.linuxhost.apt_repo
    apply:
      tags:
        - nginx-debug
        - nginx
        - apt
  loop: "{{ _nginx_repos_merged | dict2items }}"
  loop_control:
    loop_var: nginx_repo_item
    label: "{{ nginx_repo_item.key }} (enabled: {{ nginx_repo_item.value.enabled }})"
  vars:
    apt_repo_config: >-
      {{
        nginx_repo_item.value.config | combine({
          'state': nginx_repo_item.value.enabled | ternary('present', 'absent')
        })
      }}
  when: nginx_repo_manage | bool
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Force handler execution to update APT cache immediately"
  ansible.builtin.meta: flush_handlers
  when: nginx_repo_manage | bool
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Determine which repository is enabled"
  ansible.builtin.set_fact:
    _active_nginx_repo: >-
      {{
        _nginx_repos_merged | dict2items | selectattr('value.enabled', 'equalto', true) | list | first | default(none)
      }}
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Determine final list of nginx packages"
  ansible.builtin.set_fact:
    _nginx_final_packages: >-
      {{
        nginx_packages if (nginx_packages | length > 0)
        else (_active_nginx_repo.value.packages if _active_nginx_repo
        else __nginx_default_packages)
      }}
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Remove specified nginx packages"
  ansible.builtin.apt:
    name: "{{ nginx_remove_packages }}"
    state: absent
    purge: true
  become: true
  when: nginx_remove_packages | length > 0
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Install nginx packages"
  ansible.builtin.apt:
    name: "{{ _nginx_final_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags:
    - nginx-debug
    - nginx
    - apt

- name: "Create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - '/etc/nginx'
    - '/etc/nginx/conf.d'
    - '/etc/nginx/modules.d'
    - '/etc/nginx/ssl'
    - '/etc/nginx/sites-available'
    - '/etc/nginx/sites-enabled'
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Create working directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_working_owner }}"
    group: "{{ nginx_working_group }}"
    mode: "0775"
  loop:
    - '/var/log/nginx'
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Delete unnecessary files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/sites-enabled/000_default
    - /etc/nginx/sites-enabled/000_status
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Create config files"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/nginx/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 'nginx.conf'
    - 'conf.d/gzip.conf'
    - 'conf.d/log.conf'
    - 'conf.d/realip.conf'
    - 'conf.d/ssl.conf'
    - 'sites-available/default'
    - 'sites-available/status'
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Generate DH param"
  ansible.builtin.command:
    cmd: "openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048"
    creates: "/etc/nginx/ssl/dhparam.pem"
  notify: Reload nginx
  become: true
  tags:
    - nginx

- name: "Install default servernames"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}"
    dest: "/etc/nginx/sites-enabled/{{ item }}"
    state: link
    owner: root
    group: root
    mode: "0644"
  loop:
    - default
    - status
  notify: Reload nginx
  become: true
  tags:
    - nginx
    - nginx_cfg

- name: "Add nginx user to shared group"
  ansible.builtin.user:
    name: nginx
    groups: www-data
    append: true
  notify: Restart nginx
  become: true
  tags:
    - nginx
