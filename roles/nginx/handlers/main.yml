---
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
