---
nginx_repo_remote: "http://ppa.launchpad.net/ondrej/nginx/ubuntu"
nginx_repo_key_server: "keyserver.ubuntu.com"
nginx_repo_key_id:
  - "71DAEAAB4AD4CAB6"
  - "4F4EA0AAE5267A6C"
nginx_repo_key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6"
nginx_repo_keyring: "/usr/share/keyrings/ppa_ondrej_nginx.gpg"

nginx_working_owner: "www-data"
nginx_working_group: "www-data"
nginx_user: "www-data"
nginx_worker_processes: 4
nginx_worker_rlimit_nofile: 65535
nginx_worker_connections: 1024
nginx_multi_accept: false

nginx_types_hash_max_size: 1024
nginx_variables_hash_max_size: 1024
nginx_variables_hash_bucket_size: 1024
nginx_map_hash_max_size: 2048
nginx_proxy_headers_hash_max_size: 512
nginx_proxy_headers_hash_bucket_size: 64
nginx_server_names_hash_max_size: 4096
nginx_server_names_hash_bucket_size: 128


nginx_proxy_buffering: true
nginx_proxy_buffer_size: "8k"
nginx_proxy_buffers: "8 8k"
nginx_proxy_max_temp_file_size: "1024m"

nginx_client_body_buffer_size: "8k"
nginx_client_max_body_size: "1m"

nginx_gzip_disabled: false
nginx_gzip_disable:
  - "msie6"
nginx_gzip_vary: true
nginx_gzip_proxied: any
nginx_gzip_comp_level: 6
nginx_gzip_buffers: "16 8k"
nginx_gzip_http_version: "1.1"
nginx_gzip_types:
  - text/plain
  - text/css
  - application/json
  - application/x-javascript
  - text/xml
  - application/xml
  - application/xml+rss
  - text/javascript
  - application/javascript
  - image/svg+xml

nginx_real_ip_header: "X-Forwarded-For"
nginx_real_ip_recursive: false
nginx_real_ip_set_from:
  - 127.0.0.0/8
  - ::1

nginx_ssl_protocols:
  - TLSv1.2
  - TLSv1.3
nginx_ssl_ciphers:
  - "ECDHE-ECDSA-AES128-GCM-SHA256"
  - "ECDHE-RSA-AES128-GCM-SHA256"
  - "ECDHE-ECDSA-AES256-GCM-SHA384"
  - "ECDHE-RSA-AES256-GCM-SHA384"
  - "ECDHE-ECDSA-CHACHA20-POLY1305"
  - "ECDHE-RSA-CHACHA20-POLY1305"
  - "DHE-RSA-AES128-GCM-SHA256"
  - "DHE-RSA-AES256-GCM-SHA384"
nginx_ssl_session_cache: "builtin:1000  shared:SSL:10m"
nginx_ssl_prefer_server_ciphers: false
nginx_ssl_dhparam_file: "ssl/dhparam.pem"

nginx_include_sites_enabled: true
nginx_include_dirs: []
