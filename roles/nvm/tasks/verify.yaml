---
- name: Verify NVM version
  ansible.builtin.command:
    cmd: "bash -i -c 'nvm --version'"
  become: true
  become_user: "{{ nvm_user }}"
  register: nvm_check
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Print NVM version
  ansible.builtin.debug:
    msg: "NVM version for user {{ nvm_user }}: {{ nvm_check.stdout | default('Not installed yet (Check Mode)') }}"
