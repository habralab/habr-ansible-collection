---
namespace: habr
name: linuxhost
version: 2.3.1
readme: README.md

authors:
  - "Habr Team <servers@habr.team>"
  - "Vadim Rybalko <vadim@habr.team>"

description: >
  Habr Ansible Collection for managing Linux hosts and core infrastructure services.

tags:
  - infrastructure
  - linux

license:
  - MIT

dependencies:
  ansible.mariadb: ">=6.0.2,<7.0.0"
  ansible.posix: ">=2.2.2,<3.0.0"
  community.general: ">=5.1.0,<12.0.0"
  community.mongodb: ">=1.8.0,<2.0.0"
  community.postgresql: ">=4.0.0,<5.0.0"

repository: https://github.com/habralab/habr-ansible-collection
issues: https://github.com/habralab/habr-ansible-collection/issues

build_ignore:
  - "*.tar.gz"
  - "*.gitkeep"
  - "AGENTS.md"
  - ".agents"
  - ".ansible"
  - ".ansible-lint"
  - ".claude"
  - ".codex"
  - ".codex-venv"
  - ".git"
  - ".gitignore"
  - ".editorconfig"
  - ".idea"
  - ".tox"
  - ".venv"
  - ".vscode"
  - "tox.ini"
