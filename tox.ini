[tox]
envlist = ansible{216,217,218,219,220}
skipsdist = true

[testenv]
description = Run ansible-lint

basepython =
    ansible216: python3.10
    ansible217: python3.11
    ansible218: python3.11
    ansible219: python3.12
    ansible220: python3.12

deps =
    ansible216: ansible-core~=2.16.0
    ansible217: ansible-core~=2.17.0
    ansible218: ansible-core~=2.18.0
    ansible219: ansible-core~=2.19.0
    ansible220: ansible-core~=2.20.0
    ansible-lint

setenv =
    ANSIBLE_COLLECTIONS_PATH = {envtmpdir}/.ansible/collections
    ANSIBLE_ROLES_PATH = {envtmpdir}/.ansible/roles

commands =
    ansible-lint
